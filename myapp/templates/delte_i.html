{% extends "dashboard_base.html" %}
{% block title %}Нест кардани дархост | Manzil{% endblock %}
{% block content %}
    <div class="delete-wrap">
        <section class="delete-card">
            <span class="delete-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v5M14 11v5"/></svg></span>
            <h1>Дархост нест шавад?</h1>
            <p>Ин амалро баргардонидан мумкин нест.<span class="object-name">{{ object }}</span></p>
            <form method="post">
                {% csrf_token %}
                <div class="delete-actions">
                    <a class="btn btn-light" href="{% url 'bulding_all' %}">Не, баргаштан</a>
                    <button class="btn btn-danger" type="submit">Ҳа, нест кардан</button>
                </div>
            </form>
        </section>
    </div>
{% endblock %}
